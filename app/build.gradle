apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'

android {

    compileSdk 36
//    ndkVersion "26.2.11394342"
    defaultConfig {
        applicationId "com.pinaka.fort.locks"
        minSdkVersion 23
        targetSdk 36
        versionCode 402
        versionName "4.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file("smartlock.jks")
            storePassword keystorePassword
            keyAlias keystoreAlias
            keyPassword keystorePassword
        }
        release {
            storeFile file("smartlock.jks")
            storePassword keystorePassword
            keyAlias keystoreAlias
            keyPassword keystorePassword

        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable true
        }
        release {

            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
            //shrinkResources true*/
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
//            ndk.debugSymbollevel = "FULL"
        }

    }
    buildFeatures {
        buildConfig true
    }

//    ndkVersion 29.0.13599879 rc2
    packagingOptions {
        jniLibs {
            // 16 KB alignment for uncompressed libraries in the AAB/APK.
            useLegacyPackaging = false
            pickFirsts += ['lib/*/libtool-checker.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/c/CMakeLists.txt"
            version "3.22.1" // Upgrading from version "3.10.2"
        }
    }

    flavorDimensions = ["tier"]

    productFlavors {

        // main
        fortProd {
            dimension "tier"
            applicationId "com.pinaka.fort.locks"
            versionCode 1
            versionName "1.0.0"
            buildConfigField("String", "APPCENTER_KEY", "\"1ec2d533-08b7-49ff-8742-d251f5c468eb\"")
            buildConfigField("String", "BASE_URL", "\"https://techloc.in\"")
            buildConfigField("String", "TERMS_CONDITION_URL", "\"https://www.astrixengineering.com/terms-conditions/\"")
            buildConfigField("String", "PRIVACY_URL", "\"https://www.astrixengineering.com/privacy-policy/\"")
            buildConfigField("boolean", "APP_VERSION_VISIBILITY", "false")
            buildConfigField("boolean", "BATTERY_LEVEL_VISIBILITY", "true")
            buildConfigField("int", "SCRATCH_CODE_LENGTH", "10")
            buildConfigField("String", "SCRATCH_CODE_PREFIX", "\"F0\"")
            buildConfigField("boolean", "FACTORY_RESET_VISIBILITY", "true")
            buildConfigField("String", "PLAYSTORE_URL", "\"\"")
            buildConfigField("String", "MANUFACTURER_CODE", "\"FORT_\"")
            buildConfigField("String", "BUILD_VARIANT", "\"P\"")
            resValue "string", "app_name", "FORT"
        }

        fortStaging {
            dimension "tier"
            applicationId "com.pinaka.fort.locks"
            versionCode 1
            versionName "1.0.0"
            buildConfigField("String", "APPCENTER_KEY", "\"1ec2d533-08b7-49ff-8742-d251f5c468eb\"")
            buildConfigField("String", "BASE_URL", "\"https://techloc.in\"")
            buildConfigField("String", "TERMS_CONDITION_URL", "\"https://www.astrixengineering.com/terms-conditions/\"")
            buildConfigField("String", "PRIVACY_URL", "\"https://www.astrixengineering.com/privacy-policy/\"")
            buildConfigField("boolean", "APP_VERSION_VISIBILITY", "false")
            buildConfigField("boolean", "BATTERY_LEVEL_VISIBILITY", "true")
            buildConfigField("int", "SCRATCH_CODE_LENGTH", "10")
            buildConfigField("String", "SCRATCH_CODE_PREFIX", "\"F0\"")
            buildConfigField("boolean", "FACTORY_RESET_VISIBILITY", "true")
            buildConfigField("String", "PLAYSTORE_URL", "\"\"")
            buildConfigField("String", "MANUFACTURER_CODE", "\"FORT_\"")
            buildConfigField("String", "BUILD_VARIANT", "\"S\"")
            resValue "string", "app_name", "FORT Staging"
        }
    }

    namespace 'com.payoda.smartlock'
    ndkVersion '29.0.13599879 rc2'

}

dependencies {

    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.10'
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
    implementation 'com.google.firebase:firebase-crashlytics:19.0.1'
    implementation 'com.google.firebase:firebase-config:22.0.0'

    //room db
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    //v4.0
    implementation("org.greenrobot:eventbus:3.3.1")

    // (Java only)
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "androidx.concurrent:concurrent-futures:1.1.0"


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // App center integration
    implementation "com.microsoft.appcenter:appcenter-analytics:4.1.0"
    implementation "com.microsoft.appcenter:appcenter-crashes:4.1.0"

//    implementation files('libs/rootchecker-release.aar')
    implementation 'com.scottyab:rootbeer-lib:0.1.1'
    implementation files('libs/countryDialCode-release.aar')

    implementation 'io.michaelrocks:libphonenumber-android:8.12.37'
    /*implementation('com.future mind.recyclerfastscroll:fastscroll:0.2.5', {
        exclude group: 'com.android.support'
    })*/

    implementation 'com.google.android.play:integrity:1.3.0'

}

apply plugin: 'com.google.gms.google-services'